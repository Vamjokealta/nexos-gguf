name: Build Nexus GGUF Agent APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Build Tool
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Accept Android Licenses & Ensure NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Compile and Assemble Debug APK
        run: |
          gradle :android:app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-gguf-agent-arm64-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
