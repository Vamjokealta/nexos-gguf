name: Build Nexus GGUF Agent APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Configure Android SDK & Licenses
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          mkdir -p /usr/local/lib/android/sdk/licenses
          # Standard license hashes for Android SDK, NDK, and CMake
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8563bc79c7e07d83d2e130491d504338774724d5" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          printf "84831b9409646a241416e099a9a3b839958dc18b" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license

      - name: Compile and Assemble Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-gguf-agent-arm64-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
